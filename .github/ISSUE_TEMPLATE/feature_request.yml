name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景——什么时候会需要这个功能?现在是怎么将就的?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案(可选)
      description: 如果有具体的产品形态或交互想法,写在这里
    validations:
      required: false
