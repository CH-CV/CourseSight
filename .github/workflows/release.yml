name: Release

# 推送 v 开头的 tag 时自动构建并发布 Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write # 用内置 GITHUB_TOKEN 创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: 依赖
        run: flutter pub get

      # 质量闸门:不过就不出包。
      # pub workspace 多包结构:测试在 packages/coursesight_core,分包执行。
      - name: 解析引擎 analyze + test
        working-directory: packages/coursesight_core
        run: |
          flutter analyze
          flutter test

      - name: 应用 analyze
        working-directory: apps/app
        run: flutter analyze

      # 还原签名:Secrets → gradle 约定的 key.properties 与密钥库路径;
      # 未配置 Secrets 时跳过,gradle 退回 debug 签名
      - name: 还原签名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > apps/app/android/app/coursesight-release.jks
            printf 'storeFile=coursesight-release.jks\nkeyAlias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
              "$KEY_ALIAS" "$STORE_PASS" "$KEY_PASS" > apps/app/android/key.properties
          else
            echo "未配置签名 Secrets,将以 debug 签名构建"
          fi

      # 版本号从 tag 注入: v0.2.1 → versionName 0.2.1;
      # versionCode 用流水线号(单调递增)。pubspec 不改动。
      # 构建必须在 apps/app(workspace 根没有 Android 工程)。
      - name: 构建
        working-directory: apps/app
        run: |
          VER="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VER" \
            --build-number="$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/coursesight-${GITHUB_REF_NAME}.apk"

      # runner 是一次性虚拟机,清理仅作双保险
      - name: 清理密钥文件
        if: always()
        run: |
          rm -f apps/app/android/key.properties \
                apps/app/android/app/coursesight-release.jks

      - name: 发布 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # 发布说明取 tag 的 annotation(git tag -a -F 写的内容),
          # 不用自动生成的提交列表
          generate_release_notes: false
          files: apps/app/build/app/outputs/flutter-apk/coursesight-*.apk
          fail_on_unmatched_files: true
