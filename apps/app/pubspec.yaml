name: coursesight_app
description: "CourseSight(课见)——AI 通用解析教务课表的开源课表 App。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  coursesight_core:
    path: ../../packages/coursesight_core

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  flutter_inappwebview: ^6.1.5
  home_widget: ^0.9.4
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
